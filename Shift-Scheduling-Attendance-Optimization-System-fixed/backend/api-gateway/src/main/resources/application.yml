server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
        - id: employee-service
          uri: lb://employee-service
          predicates:
            - Path=/api/employees/**,/api/departments/**,/api/skills/**
        - id: scheduling-service
          uri: lb://scheduling-service
          predicates:
            - Path=/api/shifts/**,/api/schedules/**
        - id: attendance-service
          uri: lb://attendance-service
          predicates:
            - Path=/api/attendance/**
        - id: leave-service
          uri: lb://leave-service
          predicates:
            - Path=/api/leaves/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

jwt:
  secret: ${JWT_SECRET:shift-scheduling-dev-secret-key-change-in-production-2024}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
